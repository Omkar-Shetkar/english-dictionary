<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple English Dictionary</title>
  <link rel="stylesheet" href="lookup.css">
</head>
<body>
  <div class="lookup-window">
    <header class="lookup-topbar">
      <div class="search-field">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="lookupInput" placeholder="Look up any English word..." autocomplete="off" spellcheck="false" autofocus />
        <button id="clearSearchBtn" class="icon-btn clear-btn" title="Clear input" style="display: none;">✕</button>
      </div>
      <button id="closeWindowBtn" class="icon-btn close-btn" title="Close (Esc)">✕</button>
    </header>

    <main id="lookupContent" class="lookup-main">
      <div class="state-view loading-view">
        <div class="spinner"></div>
        <span class="state-text">Searching dictionary...</span>
      </div>
    </main>
  </div>

  <script src="lookup.bundle.js"></script>
</body>
</html>
